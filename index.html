<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceDash Pro | Personal Ledger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="logo">📊 Finance<span>Dash</span></div>
            <ul class="nav-links">
                <li class="nav-item active" data-section="dashboard">Dashboard</li>
                <li class="nav-item" data-section="transactions">Transactions</li>
                <li class="nav-item" data-section="reports">Reports</li>
                <li class="nav-item" data-section="budget">Budget</li>
            </ul>
        </nav>

        <main class="content-area">
            <header class="top-nav">
                <h2 id="view-title">Dashboard</h2>
                <div class="header-right">
                    <div id="api-widget" class="api-status">Connecting to Market...</div>
                    <div id="current-date"></div>
                </div>
            </header>

            <div id="main-view">
                <div id="dashboard-section" class="panel">
                    <div class="stats-row">
                        <div class="card">
                            <small>Net Worth (USD)</small>
                            <h2 id="net-balance">$0.00</h2>
                        </div>
                        <div class="card">
                            <small>Total Income</small>
                            <h3 id="inc-total" class="text-green">+$0.00</h3>
                        </div>
                        <div class="card">
                            <small>Total Expenses</small>
                            <h3 id="exp-total" class="text-red">-$0.00</h3>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="card chart-container">
                            <h3>Spending Analysis</h3>
                            <div class="canvas-wrapper">
                                <canvas id="donutChart"></canvas>
                            </div>
                        </div>
                        <div class="card form-container">
                            <h3>New Transaction</h3>
                            <form id="entry-form">
                                <input type="text" id="item-desc" placeholder="Description" required>
                                <div class="input-row">
                                    <input type="number" id="item-amt" placeholder="Amount" required>
                                    <select id="item-curr">
                                        <option value="USD">USD</option>
                                        <option value="INR">INR</option>
                                    </select>
                                </div>
                                <button type="submit" class="submit-btn">Add Entry</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="transactions-section" class="panel hidden">
                    <div class="card">
                        <h3>Full History</h3>
                        <ul id="history-list" class="ledger"></ul>
                    </div>
                </div>

                <div id="reports-section" class="panel hidden">
                    <div class="card">
                        <h3>Financial Trend</h3>
                        <div class="canvas-wrapper" style="height: 400px;">
                            <canvas id="lineTrend"></canvas>
                        </div>
                    </div>
                </div>

                <div id="budget-section" class="panel hidden">
                    <div class="card">
                        <h3>Savings Target ($5,000)</h3>
                        <div class="progress-outer">
                            <div id="progress-inner" class="progress-bar"></div>
                        </div>
                        <p id="progress-label" class="text-muted"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
